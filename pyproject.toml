[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nwrd-public"
version = "1.0.0"
description = "CANet-B4 against the NWRD paper's baselines on the public NWRD release"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Syed Muhammad Abdur Rahman" },
    { name = "Abdul Hadi Sheikh" },
    { name = "Abdullah Salim Nizami" },
]
# Versions are bounded to the APIs the code uses; constraints.txt pins the exact set the test
# suite last passed with. The Kaggle runs record theirs in runs/log.txt.
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.4",
    "opencv-python-headless>=4.9",
    "albumentations>=2.0,<3",
    "segmentation-models-pytorch==0.5.0",
    "efficientnet-pytorch==0.7.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "kaggle>=1.6",
    # Only for the test that checks our reading of the authors' metric code against scikit-learn.
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["nwrd_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs of the pipeline on CPU (minutes); deselect with -m 'not slow'",
    "data: needs the release in data/raw/NWRD (scripts/fetch_data.py); skipped without it",
]
filterwarnings = [
    "ignore::DeprecationWarning:efficientnet_pytorch.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Its long lines are the notebooks' own cell text (markdown and Kaggle code), not repository code.
"scripts/build_notebooks.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nwrd_public"]

[tool.ruff.format]
quote-style = "single"
